name: Deploy to Azure Container Apps
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build image
        run: az acr build --registry "${{ vars.AZURE_ACR_NAME }}" --image "enterprise-rag:${{ github.sha }}" .
      - name: Deploy immutable tag
        run: az containerapp update --name "${{ vars.AZURE_CONTAINER_APP }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --image "${{ vars.AZURE_ACR_NAME }}.azurecr.io/enterprise-rag:${{ github.sha }}"
